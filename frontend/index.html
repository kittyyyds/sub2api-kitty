<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kitty奇妙屋 - AI API Gateway</title>
    <meta name="description" content="一个 API Key 接入 GPT、Claude、Grok 等主流模型，兼容 OpenAI 接口，可直接用于 Codex、Claude Code 等开发工具。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Kitty奇妙屋 - AI API Gateway" />
    <meta property="og:description" content="一个 API Key 接入 GPT、Claude、Grok 等主流模型，兼容 OpenAI 接口，可直接用于 Codex、Claude Code 等开发工具。" />
    <meta property="og:image" content="/logo.svg" />
    <!-- Shown until the app mounts and replaces #app. Inline CSS only: the server CSP allows
         inline styles but not inline scripts. -->
    <style>
      .boot-splash { position: fixed; inset: 0; display: grid; place-items: center; background: #f8fafc; }
      .boot-splash img { width: 56px; height: 56px; opacity: 0.9; animation: boot-splash-pulse 1.4s ease-in-out infinite; }
      @keyframes boot-splash-pulse { 50% { opacity: 0.35; transform: scale(0.94); } }
      @media (prefers-color-scheme: dark) { .boot-splash { background: #0f172a; } }
      @media (prefers-reduced-motion: reduce) { .boot-splash img { animation: none; } }
    </style>
  </head>
  <body>
    <div id="app"><div class="boot-splash" role="status" aria-label="Loading"><img src="/logo.svg" alt="" /></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
