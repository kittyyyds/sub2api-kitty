# Root API aliases for clients that do not include /v1 in their endpoint.
# Each rewrite is internal, so the request method, body, query string, and
# authorization headers are preserved and handled by the existing /v1 proxy.

location = /sub2api/billing {
    rewrite ^ /v1/sub2api/billing last;
}

location = /messages {
    rewrite ^ /v1/messages last;
}

location = /messages/count_tokens {
    rewrite ^ /v1/messages/count_tokens last;
}

location = /usage {
    # /usage is also the authenticated Vue console route. Browser navigations
    # advertise HTML, while API clients use application/json or */*.
    if ($http_accept ~* "text/html") {
        rewrite ^ /index.html last;
    }
    rewrite ^ /v1/usage last;
}

location = /live {
    rewrite ^ /v1/live last;
}

location ^~ /live/ {
    rewrite ^/live/(.*)$ /v1/live/$1 last;
}

location = /chat/completions {
    rewrite ^ /v1/chat/completions last;
}

location = /embeddings {
    rewrite ^ /v1/embeddings last;
}

location = /images/batches {
    rewrite ^ /v1/images/batches last;
}

location ^~ /images/batches/ {
    rewrite ^/images/batches/(.*)$ /v1/images/batches/$1 last;
}
